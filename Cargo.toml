[workspace]
resolver = "3"
members = [
  "intent-core",
  "intent-evm",
  "intent-api",
  "intent-solver",
  "intent-db",
]

[workspace.package]
version = "0.0.2"
edition = "2024"
authors = ["rifuki"]
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
async-trait = "0.1.89"

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

# Error handling
thiserror = "2.0.18"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

# Config
dotenv = "0.15.0"

# EVM / Alloy
alloy = { version = "1.6.1", features = [
  "full",
  "providers",
  "contract",
  "signers",
  "signer-local",
  "network",
  "transports",
  "transport-http",
  "pubsub",
] }


chrono = { version = "0.4.43", features = ["serde"] }
